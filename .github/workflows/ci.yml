name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run basic import test
      run: |
        python -c "import main; print('Import successful')"
        python -c "import containers; print('Containers import successful')"
        python -c "import file_manager_; print('File manager import successful')"

    - name: Check code style (if black is available)
      run: |
        pip install black --quiet || echo "Black not available, skipping code style check"
        black --check . || echo "Code style check failed, but continuing"