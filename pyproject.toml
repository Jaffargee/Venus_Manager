[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venus-file-manager"
version = "1.0.0"
description = "A modern, cross-platform file manager built with Python and PyQt5"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = [
    "PyQt5>=5.15.0",
    "cryptography>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/Jaffargee/Venus_Manager"
Repository = "https://github.com/Jaffargee/Venus_Manager.git"
Issues = "https://github.com/Jaffargee/Venus_Manager/issues"

[tool.setuptools]
packages = ["."]

[tool.setuptools.package-data]
"" = ["*.css", "*.svg", "*.png", "*.ico"]